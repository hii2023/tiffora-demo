<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f3; --surface: #ffffff; --ink: #1b1b19; --ink-2: #3d3d39; --muted: #6d6d67; --line: #e5e4de; --line-2: #d4d3cc;
    --brand: #1f5f45; --brand-ink: #ffffff; --brand-soft: #e7f0eb;
    --ok: #13734b; --ok-soft: #e6f3ec; --warn: #9a5b00; --warn-soft: #fcf1df; --danger: #b42318; --danger-soft: #fdecea;
    --radius: 10px; --shadow: 0 1px 2px rgba(20,20,15,.05), 0 2px 8px rgba(20,20,15,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--brand); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .hidden { display: none !important; }
  .grow { flex: 1; }
  .right { text-align: right; }
  .num { font-variant-numeric: tabular-nums; }

  /* frame */
  .frame { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; min-width: 0; }
  .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 600; overflow: hidden; flex: none; }
  .brand-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .brand b { font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: block; padding: 8px 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; white-space: nowrap; }
  .nav a:hover { background: #f4f4f0; }
  .nav a.on { background: var(--brand-soft); color: var(--brand); }
  .side-foot { margin-top: auto; padding: 12px 8px 0; font-size: 13px; color: var(--muted); }
  .side-foot div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { padding: 28px 28px 80px; max-width: 1080px; width: 100%; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -.015em; margin: 0; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; }
  h3 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .crumb { font-size: 13px; margin-bottom: 8px; }
  .crumb a { color: var(--muted); text-decoration: none; }

  /* buttons and fields */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--ink); }
  .btn:hover { background: #fafaf8; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.primary:hover { filter: brightness(1.07); background: var(--brand); }
  .btn.danger { color: var(--danger); border-color: #f0c9c5; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--ink-2); min-width: 0; }
  label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=password], input[type=time], input[type=date], select, textarea { height: 40px; padding: 0 11px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; width: 100%; min-width: 0; }
  textarea { height: auto; padding: 9px 11px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--brand) 30%, transparent); border-color: var(--brand); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; }
  .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .switch input { width: 18px; height: 18px; accent-color: var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; }
  .chip span { display: inline-block; padding: 5px 12px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 13px; cursor: pointer; background: #fff; }
  .chip input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip input:focus-visible + span { outline: 2px solid var(--brand); }
  .chip input:disabled + span { opacity: .4; cursor: not-allowed; }
  .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctl input[type=date] { width: 160px; }
  .ctl select { width: auto; max-width: 180px; }

  /* cards, tables, lists */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
  .pad { padding: 18px 20px; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { padding: 14px 16px; margin: 0; }
  .stat b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .stat span { font-size: 13px; color: var(--muted); }
  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .table tr:last-child td { border-bottom: 0; }
  .table tr.click { cursor: pointer; }
  .table tr.click:hover td { background: #fafaf7; }
  .scroll-x { overflow-x: auto; }
  .empty { padding: 36px 20px; text-align: center; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: #efeee9; color: var(--ink-2); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }
  .note { padding: 11px 14px; border-radius: 8px; background: #f3f2ed; font-size: 13px; color: var(--ink-2); }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .row-list > div { padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .row-list > div:last-child { border-bottom: 0; }
  .d-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) auto; gap: 8px 16px; align-items: start; }
  .d-row.off { opacity: .55; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .link-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .link-row .mono { word-break: break-all; }

  /* kitchen sheet */
  .sheet-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .big { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .sheet-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 24px; margin-top: 14px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .kv:last-child { border-bottom: 0; }
  .kv b { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* customer */
  .plan-card { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .plan-card:last-child { border-bottom: 0; }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; margin: 12px 0; }
  .facts span { display: block; font-size: 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: #ecebe6; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--brand); }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .scroll-y { max-height: 420px; overflow-y: auto; }
  tr.today td { background: var(--brand-soft); }

  /* login, modal, toast */
  .login { max-width: 400px; margin: 10vh auto 0; padding: 0 16px; }
  .login form { display: flex; flex-direction: column; gap: 14px; }
  .tabs { display: flex; gap: 4px; background: #efeee9; padding: 3px; border-radius: 8px; }
  .tabs button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
  .tabs button.on { background: #fff; box-shadow: var(--shadow); }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; }
  .modal-back { position: fixed; inset: 0; background: rgba(20, 20, 15, .35); display: flex; justify-content: center; align-items: flex-start; z-index: 50; padding: 5vh 16px; overflow-y: auto; }
  .modal { width: 100%; max-width: 480px; margin: 0; }
  .modal.wide { max-width: 640px; }
  .modal form, .modal .inner { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 10px; }
  .pin-show { font-family: 'IBM Plex Mono', monospace; font-size: 38px; letter-spacing: .15em; text-align: center; padding: 12px; background: #f3f2ed; border-radius: 8px; }
  .map { height: 240px; border-radius: 8px; border: 1px solid var(--line-2); }
  .total-line { display: flex; justify-content: space-between; font-weight: 600; padding: 10px 14px; background: #f3f2ed; border-radius: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 60; max-width: calc(100% - 32px); }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.bad { background: var(--danger); }

  @media (max-width: 820px) {
    .frame { display: block; }
    .side { position: sticky; top: 0; z-index: 20; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px 6px; display: block; }
    .brand { padding: 2px 0 6px; }
    .brand-mark { width: 26px; height: 26px; font-size: 13px; }
    .nav { flex-direction: row; overflow-x: auto; gap: 2px; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .side-foot { display: none; }
    main { padding: 18px 16px 70px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .sheet-cols, .facts { grid-template-columns: 1fr 1fr; }
    .hide-sm { display: none; }
  }
  @media (max-width: 560px) {
    .grid, .grid.three, .sheet-cols { grid-template-columns: 1fr; }
    .span2 { grid-column: auto; }
    .d-row { grid-template-columns: 1fr; }
    .acts { justify-content: flex-start; }
    .pad, .card-head, .row-list > div, .plan-card { padding-left: 16px; padding-right: 16px; }
    .ctl input[type=date] { width: 150px; }
  }
  @media print {
    .side, .noprint, #toast { display: none !important; }
    .frame { display: block; }
    main { padding: 0; max-width: none; }
    html, body { background: #fff; }
    .card { box-shadow: none; break-inside: avoid; }
  }
</style>
<script src="../config.js"></script>
<script src="../shared/api.js"></script>
</head>
<body>
<div id="app"></div>
<div id="modals"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const api = MealApi.createClient('kitchenadmin');
  const app = document.getElementById('app');
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const PAGES = [
    { key: 'today', label: 'Today', open: true },
    { key: 'kitchen', label: 'Kitchen sheet' },
    { key: 'deliveries', label: 'Deliveries' },
    { key: 'customers', label: 'Customers' },
    { key: 'payments', label: 'Payments' },
    { key: 'plans', label: 'Plans & prices' },
    { key: 'menu', label: 'Menu' },
    { key: 'holidays', label: 'Holidays' },
    { key: 'team', label: 'Team', manager: true },
    { key: 'settings', label: 'Settings', manager: true },
  ];
  const GRANTABLE = PAGES.filter((p) => !p.open && !p.manager);
  const ROLE_LABEL = { owner: 'Owner', manager: 'Manager', kitchen: 'Kitchen', accounts: 'Accounts', staff: 'Staff' };
  const ROLE_PAGES = { kitchen: ['kitchen', 'deliveries', 'menu'], accounts: ['customers', 'payments'], staff: ['deliveries', 'customers'] };
  const METHOD = { cash: 'Cash', upi: 'UPI', bank: 'Bank', other: 'Other', razorpay: 'Online' };
  const HISTORY = {
    'plan.activate': 'Plan started', 'plan.update': 'Plan changed', 'plan.charges': 'Amounts changed', 'plan.pause': 'Plan paused', 'plan.resume': 'Plan resumed',
    'plan.cancel': 'Plan cancelled', 'delivery.skip': 'Skipped', 'delivery.unskip': 'Skip undone', 'delivery.cancel': 'Delivery cancelled', 'delivery.undelivered': 'Delivered mark undone',
    'meals.adjust': 'Meals changed', 'payment.record': 'Payment recorded', 'payment.void': 'Payment removed', 'customer.create': 'Customer added', 'customer.update': 'Details changed',
    'customer.pin_reset': 'PIN reset', 'address.save': 'Address saved', 'address.remove': 'Address removed',
  };

  let T = null, ME = null, L = null, busy = false;
  const S = {
    page: 'today', param: null,
    kitchen: { date: null },
    dl: { date: null, slot: '', show: 'open', rows: [] },
    cust: { q: '', filter: 'all', rows: [], total: 0 },
    pay: { from: null, to: null },
    menu: { week: null, slot: null, variant: '' },
    data: null,
  };

  // ---------- helpers ----------
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = (p) => (Number(p) < 0 ? '-' : '') + '₹' + (Math.abs(Number(p || 0)) / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const rupees = (p) => (p == null ? '' : String(Number(p) / 100));
  const toPaise = (r) => Math.round(Number(r) * 100);
  const d0 = (d) => new Date(String(d).slice(0, 10) + 'T00:00:00');
  const day = (d) => (d ? d0(d).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) : '');
  const dayLong = (d) => (d ? d0(d).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '');
  const stamp = (t) => (t ? new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '');
  const dateOnly = (t) => (t ? new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
  const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const addDays = (d, n) => { const x = d0(d); x.setDate(x.getDate() + n); return iso(x); };
  const mondayOf = (d) => { const n = (d0(d).getDay() + 6) % 7; return addDays(d, -n); };
  const phoneShow = (p) => (String(p || '').length === 12 && String(p).startsWith('91') ? String(p).slice(2) : p || '');
  const timeShow = (t) => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; };
  const can = (page) => { const p = PAGES.find((x) => x.key === page); if (p?.open) return true; if (ME.pages.includes('*')) return true; return !p?.manager && ME.pages.includes(page); };
  // A page answer that arrives after the person has moved on must not draw over the new page.
  const STALE = new Error('stale');
  let routeSeq = 0;
  const rpc = async (fn, args = {}) => {
    const at = routeSeq;
    const r = await api.rpc(fn, { p_tenant: T.id, ...args });
    if (at !== routeSeq) throw STALE;
    return r;
  };
  const $ = (q, el = document) => el.querySelector(q);
  const activeSlots = () => L.slots.filter((x) => x.active);
  const activeVariants = () => L.variants.filter((x) => x.active);
  const options = (rows, sel, label = (r) => r.name) => rows.map((r) => `<option value="${esc(r.id)}" ${r.id === sel ? 'selected' : ''}>${esc(label(r))}</option>`).join('');

  let toastTimer;
  function toast(msg, bad) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), bad ? 5000 : 2600);
  }
  async function run(fn, okMsg) {
    if (busy) return;
    busy = true; document.body.style.cursor = 'progress';
    try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
    catch (e) { if (e !== STALE) toast(e.message, true); }
    finally { busy = false; document.body.style.cursor = ''; }
  }
  function download(name, text) {
    const url = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  // Excel runs a cell starting with = + - @ as a formula, and names and notes come from customers.
  function cell(v) {
    if (v == null) return '';
    if (typeof v === 'number') return String(v);
    let s = String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  const toCsv = (rows) => rows.map((r) => r.map(cell).join(',')).join('\r\n') + '\r\n';
  function parseCsv(text) {
    const rows = []; let row = [], val = '', q = false;
    text = text.replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { val += '"'; i++; } else q = false; } else val += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(val); val = ''; }
      else if (c === '\n') { row.push(val); rows.push(row); row = []; val = ''; }
      else if (c !== '\r') val += c;
    }
    if (val || row.length) { row.push(val); rows.push(row); }
    return rows.filter((r) => r.some((x) => x.trim()));
  }
  function readDate(s) {
    s = (s || '').trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
    return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
  }

  // ---------- modal ----------
  function closeModal() { document.getElementById('modals').innerHTML = ''; }
  function openModal({ title, body, submit = 'Save', danger, wide, onSubmit, onOpen, cancel = 'Cancel' }) {
    const host = document.getElementById('modals');
    host.innerHTML = `<div class="modal-back"><div class="card modal ${wide ? 'wide' : ''}"><form novalidate>
        <h2>${esc(title)}</h2>${body}<div class="err"></div>
        <div class="foot"><button type="button" class="btn" data-close>${esc(cancel)}</button>${onSubmit ? `<button class="btn ${danger ? 'danger' : 'primary'}" type="submit">${esc(submit)}</button>` : ''}</div>
      </form></div></div>`;
    const form = $('form', host), err = $('.err', host);
    $('[data-close]', host).onclick = closeModal;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!onSubmit || busy) return;
      err.textContent = '';
      busy = true;
      const btn = $('button[type=submit]', form); btn.disabled = true;
      try { await onSubmit(new FormData(form), form); }
      catch (x) { if (x !== STALE) err.textContent = x.message; }
      finally { busy = false; btn.disabled = false; }
    });
    if (onOpen) onOpen(form);
    $('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), select, textarea', form)?.focus({ preventScroll: true });
  }

  // ---------- map ----------
  let leaflet = null;
  function loadLeaflet() {
    if (leaflet) return leaflet;
    leaflet = new Promise((ok, no) => {
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
      const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s);
    });
    return leaflet;
  }
  async function mountPin(el, point, onMove) {
    try { await loadLeaflet(); } catch { el.textContent = 'The map could not load.'; return; }
    const c = L_center(point);
    const m = window.L.map(el, { scrollWheelZoom: false }).setView(c.at, c.zoom);
    window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(m);
    const icon = window.L.divIcon({ className: '', html: '<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--brand);transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>', iconSize: [22, 22], iconAnchor: [11, 22] });
    let pin = null;
    const put = (lat, lng) => {
      if (!pin) { pin = window.L.marker([lat, lng], { icon, draggable: true }).addTo(m); pin.on('dragend', () => { const p = pin.getLatLng(); onMove(p.lat, p.lng); }); }
      else pin.setLatLng([lat, lng]);
    };
    if (point.lat != null) put(point.lat, point.lng);
    m.on('click', (e) => { put(e.latlng.lat, e.latlng.lng); onMove(e.latlng.lat, e.latlng.lng); });
    setTimeout(() => m.invalidateSize(), 60);
  }
  function L_center(point) {
    if (point.lat != null) return { at: [point.lat, point.lng], zoom: 16 };
    const s = L.settings;
    return s.kitchen_lat != null ? { at: [s.kitchen_lat, s.kitchen_lng], zoom: 13 } : { at: [20.59, 78.96], zoom: 5 };

  function historyDetail(h) {

    if (h.action === 'payment.record' || h.action === 'payment.void') return `: ${inr(x.amount_paise)} ${esc(METHOD[x.provider] || '')}`;

  function orderFrom(f, paid, withPayment) {
    const where = f.get('where');
    const o = { plan_id: f.get('plan'), variant_id: f.get('variant'), slot_id: f.get('slot'), delivery_days: f.getAll('day').map(Number), meals_per_day: Number(f.get('per_day') || 1),
      addons: f.getAll('addon').map((id) => ({ addon_id: id, qty: 1 })), is_pickup: where === 'pickup', address_id: where === 'pickup' ? null : where, instructions: f.get('instructions') };
    if (f.get('start')) o.start_date = f.get('start');
    if (paid) {
      if (String(f.get('price')).trim() !== '') o.price_paise = toPaise(f.get('price'));
      if (String(f.get('fee')).trim() !== '') o.delivery_fee_paise = toPaise(f.get('fee'));
      if (String(f.get('discount')).trim() !== '') o.discount_paise = toPaise(f.get('discount'));
      if (withPayment && Number(f.get('paid')) > 0) o.payment = { provider: f.get('method'), amount_paise: toPaise(f.get('paid')) };
    }
    return o;
  }
  function editPlanModal(p) {
    const paid = !!S.data.payments;
    const slots = L.slots.filter((x) => x.active || x.id === p.slot_id);
    const vars = L.variants.filter((x) => x.active || x.id === p.variant_id);
    const addons = L.addons.filter((a) => a.active || p.addons.some((x) => x.addon_id === a.id));
    openModal({

        <label class="f">Delivery total<input type="number" name="fee" min="0" value="${rupees(p.delivery_fee_paise)}"></label><label class="f">Discount<input type="number" name="discount" min="0" value="${rupees(p.discount_paise)}"></label>` : ''}
      </div>`,
      onSubmit: async (f) => {
        const where = f.get('where');
        const ch = {};
        const put = (k, v, old) => { if (JSON.stringify(v) !== JSON.stringify(old)) ch[k] = v; };
        put('variant_id', f.get('variant'), p.variant_id); put('slot_id', f.get('slot'), p.slot_id);
        put('start_date', f.get('start'), p.start_date); put('meals_per_day', Number(f.get('per_day')), p.meals_per_day);
        const days = f.getAll('day').map(Number).sort();
        put('delivery_days', days, p.delivery_days.slice().sort());
        const ids = f.getAll('addon');
        if (ids.slice().sort().join() !== p.addons.map((a) => a.addon_id).sort().join()) ch.addons = ids.map((id) => p.addons.find((a) => a.addon_id === id) || { addon_id: id, qty: 1 });
        put('is_pickup', where === 'pickup', p.is_pickup);
        if (where !== 'pickup') put('address_id', where, p.address_id);
        put('instructions', f.get('instructions'), p.instructions || '');

      },
    });

      if (f.t === 'check') return `<label class="switch span2"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${esc(f.l)}</label>`;
      if (f.t === 'area') return `<label class="f${cls}">${esc(f.l)}<textarea name="${f.k}" rows="2">${esc(v)}</textarea></label>`;
      if (f.t === 'select') return `<label class="f${cls}">${esc(f.l)}<select name="${f.k}">${f.opts.map(([o, l]) => `<option value="${o}" ${o === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;

      const val = f.t === 'money' ? rupees(v) : f.t === 'time' ? String(v ?? '').slice(0, 5) : v;

    }).join('');

      title: `${row ? 'Edit' : 'Add'} ${cfg.title}`, body: `<div class="grid">${fieldHtml}</div>`,
      onSubmit: async (f) => {

        for (const x of cfg.fields) {
          if (x.t === 'check') { out[x.k] = f.get(x.k) === 'on'; continue; }
          const raw = String(f.get(x.k) ?? '').trim();

          out[x.k] = raw === '' ? null : x.t === 'money' ? toPaise(raw) : x.t === 'number' ? Number(raw) : raw;
        }
        delete out.earliest_start;
        await rpc('staff_save_rows', { p_kind: kind, p_rows: [out] });
        await refreshLookups();
        afterChange('Saved');
      },
    });

  function menuUpload(file) {
    const reader = new FileReader();
    reader.onload = () => run(async () => {
      const rows = parseCsv(String(reader.result));
      if (rows.length < 2) throw new Error('The sheet is empty.');
      const head = rows[0].map((h) => h.trim().toLowerCase());
      const col = (n) => head.indexOf(n);
      if (col('date') < 0 || col('meal') < 0 || col('dish') < 0) throw new Error('The sheet needs columns named date, meal and dish.');
      const out = [];
      rows.slice(1).forEach((r, i) => {
        const line = i + 2;
        const date = readDate(r[col('date')]);
        if (!date) throw new Error(`Line ${line}: the date is not readable. Use 2027-03-15 or 15/03/2027.`);
        const slot = L.slots.find((s) => s.name.toLowerCase() === (r[col('meal')] || '').trim().toLowerCase());
        if (!slot) throw new Error(`Line ${line}: no meal slot named "${(r[col('meal')] || '').trim()}".`);
        const tName = col('type') >= 0 ? (r[col('type')] || '').trim().toLowerCase() : '';
        let variant = null;
        if (tName && tName !== 'all') {
          variant = L.variants.find((v) => v.name.toLowerCase() === tName);
          if (!variant) throw new Error(`Line ${line}: no meal type named "${tName}".`);
        }
        out.push({ date, slot_id: slot.id, variant_id: variant?.id || null, name: r[col('dish')] || '', description: col('details') >= 0 ? r[col('details')] || '' : '' });
      });
      const res = await rpc('staff_save_menu', { p_rows: out });
      toast(`${res.saved} dishes saved`);
      reload();
    });
    reader.readAsText(file);
  }

    'dl-csv': deliveriesCsv,
    'dl-done': (el) => run(() => rpc('staff_mark_delivered', { p_ids: [el.dataset.id] }).then(reload), 'Marked delivered'),
    'dl-undo': (el) => run(() => rpc('staff_undo_delivered', { p_delivery: el.dataset.id }).then(reload), 'Undone'),
    'dl-cancel': (el) => cancelDeliveryModal(el.dataset.id, reload),
    'dl-unskip': (el) => run(() => rpc('staff_unskip', { p_sub: el.dataset.sub, p_date: el.dataset.date }).then(reload), 'Restored'),
    'dl-all': () => { const ids = shownDeliveries().filter((x) => x.status === 'scheduled').map((x) => x.id); if (!confirm(`Mark ${ids.length} deliveries as delivered?`)) return; run(() => rpc('staff_mark_delivered', { p_ids: ids }).then(reload), 'Marked delivered'); },
    'cust-new': newCustomerModal,
    'cust-more': () => run(() => loadCustomers(true)),
    'c-edit': () => { const c = currentCustomer(); openModal({ title: 'Edit customer', body: customerForm(c), onSubmit: async (f) => { await rpc('staff_save_customer', { p_data: { id: c.id, name: f.get('name'), phone: f.get('phone'), email: f.get('email'), notes: f.get('notes') } }); afterChange('Saved'); } }); },
    'c-pin': () => { if (!confirm('Make a new PIN for this customer? Their old PIN stops working and they are signed out.')) return; run(async () => { const r = await rpc('staff_reset_pin', { p_customer: currentCustomer().id }); showPin('New PIN', r.pin, reload); }); },
    'c-skip': (el) => run(() => rpc('staff_skip', { p_sub: el.dataset.sub, p_dates: [el.dataset.date], p_reason: 'By kitchen' }).then(reload), 'Skipped. The meal moved to the end.'),
    'c-unskip': (el) => run(() => rpc('staff_unskip', { p_sub: el.dataset.sub, p_date: el.dataset.date }).then(reload), 'Restored'),
    'c-cancel-day': (el) => cancelDeliveryModal(el.dataset.id, reload),
    'c-undo-done': (el) => run(() => rpc('staff_undo_delivered', { p_delivery: el.dataset.id }).then(reload), 'Undone'),
    'addr-new': () => addressModal(null),
    'addr-edit': (el) => addressModal(S.data.addresses.find((a) => a.id === el.dataset.id)),
    'addr-remove': (el) => { if (confirm('Remove this address?')) run(() => rpc('staff_remove_address', { p_customer: currentCustomer().id, p_address: el.dataset.id }).then(reload), 'Removed'); },
    'plan-new': () => planModal(null),
    'plan-renew': (el) => planModal(planById(el.dataset.id)),
    'plan-edit': (el) => editPlanModal(planById(el.dataset.id)),
    'plan-meals': (el) => { const p = planById(el.dataset.id); openModal({ title: 'Add or remove meals', submit: 'Save',
      body: `<p class="muted small" style="margin:0">${p.meals_left} meals left now. Use a minus number to remove.</p><div class="grid"><label class="f">Change<input type="number" name="delta" step="1" required placeholder="2 or -2"></label><label class="f">Reason<input type="text" name="note" required maxlength="200"></label></div>`,
      onSubmit: async (f) => { await rpc('staff_adjust_meals', { p_sub: p.id, p_delta: Number(f.get('delta') || 0), p_note: f.get('note') }); afterChange('Meals changed'); } }); },
    'plan-pause': (el) => { openModal({ title: 'Pause plan', submit: 'Pause',
      body: `<div class="grid"><label class="f">From<input type="date" name="from" value="${esc(S.data.today)}" min="${esc(S.data.today)}"></label><label class="f">Until<input type="date" name="until" min="${esc(S.data.today)}"><span class="hint">Leave empty to pause until you resume it.</span></label></div>`,
      onSubmit: async (f) => { const r = await rpc('staff_pause', { p_sub: el.dataset.id, p_from: f.get('from') || null, p_until: f.get('until') || null }); afterChange(r.locked ? 'Paused. A meal past its cut-off still goes out.' : 'Paused'); } }); },
    'plan-resume': (el) => run(() => rpc('staff_resume', { p_sub: el.dataset.id }).then(reload), 'Resumed'),
    'plan-cancel': (el) => { const p = planById(el.dataset.id); openModal({ title: `Cancel ${p.plan_name}`, submit: 'Cancel plan', danger: true, cancel: 'Keep plan',
      body: `<p class="muted small" style="margin:0">${p.meals_left} meals are left. Upcoming meals stop. Any refund is separate: record it under Payments below.</p><label class="f">Reason<input type="text" name="reason" required maxlength="200"></label>`,
      onSubmit: async (f) => { if (!String(f.get('reason')).trim()) throw new Error('Please give a reason.'); await rpc('staff_cancel_plan', { p_sub: p.id, p_reason: f.get('reason') }); afterChange('Plan cancelled'); } }); },
    'pay-new': recordPaymentModal,
    'pay-void': (el) => { if (confirm('Remove this payment? Use this only if it was entered by mistake.')) run(() => rpc('staff_void_payment', { p_payment: el.dataset.id }).then(reload), 'Removed'); },
    'pay-csv': () => download(`payments-${S.pay.from}-to-${S.pay.to}.csv`, toCsv([['Date', 'Customer', 'Phone', 'Plan', 'Amount', 'How', 'Note', 'Recorded by', 'Reference'],
      ...S.data.rows.map((p) => [dateOnly(p.date), p.customer, p.phone, p.plan_name, p.amount_paise / 100, METHOD[p.provider] || p.provider, p.note, p.recorded_by, p.reference])])),
    'row-new': (el) => rowModal(el.dataset.kind, null),
    'row-edit': (el) => rowModal(el.dataset.kind, L[el.dataset.kind].find((r) => r.id === el.dataset.id)),
    'row-del': (el) => { const r = L[el.dataset.kind].find((x) => x.id === el.dataset.id); removeRow(el.dataset.kind, r, r.name || r.code); },
    'menu-week': (el) => { S.menu.week = addDays(S.menu.week, Number(el.dataset.step)); reload(); },
    'menu-save': () => { const rows = {}; app.querySelectorAll('[data-menu]').forEach((i) => { (rows[i.dataset.menu] ||= { date: i.dataset.menu, slot_id: S.menu.slot, variant_id: S.menu.variant || null })[i.dataset.k] = i.value; });
      run(() => rpc('staff_save_menu', { p_rows: Object.values(rows) }).then(reload), 'Menu saved'); },
    'menu-copy': () => { if (!confirm('Copy last week\'s menu into this week? Dishes with the same day, slot and type are replaced.')) return;
      run(async () => { const prev = await rpc('staff_menu', { p_from: addDays(S.menu.week, -7), p_to: addDays(S.menu.week, -1) });
        if (!prev.length) throw new Error('Last week has no menu.');
        await rpc('staff_save_menu', { p_rows: prev.map((m) => ({ ...m, date: addDays(m.date, 7) })) }); toast('Copied'); reload(); }); },
    'menu-upload': () => $('#menu-file').click(),
    'menu-sample': () => { const s = L.slots[0]?.name || 'Lunch', w = S.menu.week; download('menu-sample.csv', toCsv([['date', 'meal', 'type', 'dish', 'details'], [w, s, 'All', 'Dal, rice, sabzi', 'With salad'], [addDays(w, 1), s, 'All', 'Rajma chawal', '']])); },
    'hol-del': (el) => { if (confirm('Remove this holiday? Meals move back onto that day.')) run(() => rpc('staff_save_rows', { p_kind: 'holidays', p_rows: [{ day: el.dataset.day, _delete: true }] }).then(reload), 'Removed'); },
    'team-invite': inviteModal,
    'team-edit': (el) => memberModal(S.data.staff.find((s) => s.id === el.dataset.id)),
    'team-cancel': (el) => { if (confirm('Cancel this invite?')) run(() => rpc('staff_cancel_invite', { p_invite: el.dataset.id }).then(reload), 'Cancelled'); },
    'copy-link': () => navigator.clipboard.writeText(signInLink()).then(() => toast('Copied'), () => toast('Could not copy. Select the text instead.', true)),
  };
  const CHANGES = {
    'kitchen-day': (el) => { if (el.value) { S.kitchen.date = el.value; reload(); } },
    'dl-day': (el) => { if (el.value) { S.dl.date = el.value; reload(); } },
    'dl-slot': (el) => { S.dl.slot = el.value; reload(); },
    'dl-show': (el) => { S.dl.show = el.value; renderDeliveries(); },
    'cust-filter': (el) => { S.cust.filter = el.value; run(() => loadCustomers()); },
    'pay-from': (el) => { if (el.value) { S.pay.from = el.value; reload(); } },
    'pay-to': (el) => { if (el.value) { S.pay.to = el.value; reload(); } },
    'menu-slot': (el) => { S.menu.slot = el.value; reload(); },
    'menu-variant': (el) => { S.menu.variant = el.value; reload(); },
  };
  document.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]');
    if (act) { e.preventDefault(); ACTS[act.dataset.act]?.(act); return; }
    const row = e.target.closest('tr[data-href]');
    if (row && !e.target.closest('a,button')) location.hash = row.dataset.href;
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'menu-file' && e.target.files[0]) return menuUpload(e.target.files[0]);
    const c = e.target.closest('[data-change]');
    if (c) CHANGES[c.dataset.change]?.(c);
  });

  // ---------- sign in ----------
  function renderLogin(msg, mode = 'in') {
    const name = T?.brand?.name || 'Kitchen admin';
    app.innerHTML = `<div class="login"><div class="card"><div class="pad">
      <div class="brand" style="padding:0 0 14px">${T ? `<span class="brand-mark">${T.brand.logo_url ? `<img src="${esc(T.brand.logo_url)}" alt="">` : esc(name[0])}</span>` : ''}<b>${esc(name)}</b></div>
      <div class="tabs" style="margin-bottom:14px"><button type="button" data-mode="in" class="${mode === 'in' ? 'on' : ''}">Sign in</button><button type="button" data-mode="up" class="${mode === 'up' ? 'on' : ''}">First time here</button></div>
      <form id="login-form">
        ${mode === 'up' ? '<p class="small muted" style="margin:0">Use the email your kitchen was added with, and choose a password.</p>' : ''}
        <label class="f">Email<input type="email" name="email" autocomplete="username" required></label>
        <label class="f">Password<input type="password" name="password" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}" required minlength="8"></label>
        <div class="err">${esc(msg || '')}</div>
        <button class="btn primary" type="submit">${mode === 'up' ? 'Create login' : 'Sign in'}</button>
        ${mode === 'in' ? '<p class="small muted" style="margin:0">Forgot your password? Ask your platform contact.</p>' : ''}
      </form></div></div></div>`;
    app.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => renderLogin('', b.dataset.mode)));
    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target), err = $('.err', e.target);
      err.textContent = '';
      const email = String(f.get('email')).trim(), password = String(f.get('password'));
      try {
        if (mode === 'up') {
          if (password.length < 8) throw new Error('Please use at least 8 characters.');
          const r = await api.signUp(email, password);
          if (!r.access_token) {
            app.querySelector('.pad').innerHTML = `<h2>Almost there</h2><p class="muted">If this is a new login, we sent a confirmation link to <b>${esc(email)}</b>. Open it, then come back to this page and sign in.</p><p class="small muted">If you already made a password, just sign in.</p><button class="btn primary" id="back-in">Go to sign in</button>`;
            $('#back-in').onclick = () => renderLogin('');
            return;
          }
        }
        await api.signIn(email, password);
        await enter();
      } catch (x) { err.textContent = /invalid login/i.test(x.message) ? 'Wrong email or password. New here? Choose "First time here".' : /not confirmed/i.test(x.message) ? 'Please open the confirmation link in your email first.' : x.message; }
    });
  }
  function blocked(title, text) {
    app.innerHTML = `<div class="login"><div class="card pad"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><button class="btn" data-act="signout">Sign out</button></div></div>`;
  }

  async function enter() {
    const mine = await api.rpc('staff_claim_invites');
    if (!T) {
      if (mine.length === 1) { location.search = `?k=${mine[0].slug}`; return; }
      if (!mine.length) return blocked('No kitchen yet', 'This login is not part of any kitchen. Ask your manager to add this email.');
      app.innerHTML = `<div class="login"><div class="card pad"><h2 style="margin-bottom:12px">Choose a kitchen</h2><div style="display:flex;flex-direction:column;gap:8px">${mine.map((k) => `<a class="btn" href="?k=${esc(k.slug)}">${esc(k.name)}</a>`).join('')}</div></div></div>`;
      return;
    }
    try { ME = await api.rpc('staff_me', { p_tenant: T.id }); }
    catch (e) {
      if (e.status === 401) { await api.signOut(); return renderLogin('Please sign in again.'); }
      if (e.status === 403) return blocked(`Not part of ${T.brand.name}`, /suspended/i.test(e.message) ? e.message : 'This login is not on this kitchen\'s team. If you were just added, check you used the same email.');
      throw e;
    }
    T = { ...T, ...ME.tenant };
    L = await rpc('staff_lookups');
    route();
  }

  (async function boot() {
    try {
      const qs = new URLSearchParams(location.search);
      const shared = ['localhost', '127.0.0.1'].includes(location.hostname) || MealApi.config.SHARED_HOST;
      const key = shared ? qs.get('k') : location.hostname;
      if (key) {
        T = await api.rpc('pub_tenant', { p_host: key });
        if (!T) { app.innerHTML = '<div class="login"><div class="card pad"><h2>Kitchen not found</h2><p class="muted">Please check the web address.</p></div></div>'; return; }
        document.title = `${T.brand.name} admin`;
        const root = document.documentElement.style, c = T.brand.color_primary;
        const [r, g, b] = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
        root.setProperty('--brand', c);
        root.setProperty('--brand-ink', 0.299 * r + 0.587 * g + 0.114 * b > 170 ? '#1b1b19' : '#ffffff');
        root.setProperty('--brand-soft', `rgba(${r},${g},${b},.12)`);
      }
      if (!api.signedIn()) return renderLogin();
      await enter();
    } catch (e) {
      if (e.status === 401) { await api.signOut(); return renderLogin(); }
      app.innerHTML = `<div class="login"><div class="card pad"><h2>Could not load</h2><p class="muted">${esc(e.message)}</p></div></div>`;
    }
  })();
})();
</script>
</body>
</html>
